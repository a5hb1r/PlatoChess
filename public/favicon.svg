<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PlatoChess">
  <!-- Brand teal background -->
  <rect width="32" height="32" rx="6" fill="hsl(191,92%,56%)"/>
  <!-- Parthenon pediment (thick triangle) -->
  <polygon points="16,6 24.5,11.5 7.5,11.5" fill="#0c1a24"/>
  <!-- Entablature bar -->
  <rect x="7.5" y="11.5" width="17" height="1.5" fill="#0c1a24"/>
  <!-- Three thick columns -->
  <rect x="9"   y="13" width="3"   height="9.5" rx="0.5" fill="#0c1a24"/>
  <rect x="14.5" y="13" width="3"   height="9.5" rx="0.5" fill="#0c1a24"/>
  <rect x="20"  y="13" width="3"   height="9.5" rx="0.5" fill="#0c1a24"/>
  <!-- Base step -->
  <rect x="7" y="22.5" width="18" height="2.5" rx="0.5" fill="#0c1a24"/>
</svg>
